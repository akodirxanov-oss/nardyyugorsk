<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Федерация нард города Югорск</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bgDark:#0A0A0C; --surface:#141518; --surfaceRaised:#1A1C20; --line:#25272C;
    --slate:#3E5C60; --slateDim:#2A3E41; --brass:#B08D46; --brassSoft:#D9BC7C;
    --cream:#EDEAE3; --creamDim:#8B8E94; --danger:#C1595A;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bgDark); }
  body{ font-family:'Manrope',sans-serif; color:var(--cream); }
  ::selection{ background:var(--brass); color:var(--bgDark); }
  input, textarea{
    font-family:'Manrope',sans-serif; background:#0F1013; border:1px solid #25272C;
    color:var(--cream); border-radius:8px; padding:9px 12px; font-size:14px; outline:none; width:100%;
  }
  input:focus, textarea:focus{ border-color:var(--brass); }
  textarea{ resize:vertical; min-height:90px; line-height:1.5; }
  button{ font-family:'Manrope',sans-serif; cursor:pointer; }
  button:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  .fade-in{ animation: fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .card-hover{ transition: transform .18s ease, border-color .18s ease; }
  .card-hover:hover{ transform: translateY(-3px); border-color: var(--brass); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ============================================================
// НАСТРОЙКА — вставьте сюда данные вашего проекта Supabase.
// Где взять: Supabase → ваш проект → Project Settings → API
//   Project URL      → SUPABASE_URL
//   anon public key  → SUPABASE_ANON_KEY
// ============================================================
const SUPABASE_URL = "https://etpttjovjklxghjkpgmw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ptad4-XrLQ5dNiqgUTfkSg_CZ8V8xUr";
// ============================================================

const CONFIG_OK = SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;
const db = CONFIG_OK ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const COLORS = {
  bgDark:"#0A0A0C", woodMid:"#3E5C60", woodMid2:"#2A3E41",
  felt:"#141518", feltDark:"#1A1C20", gold:"#B08D46", goldSoft:"#D9BC7C",
  cream:"#EDEAE3", creamDim:"#8B8E94", burgundy:"#C1595A",
};

const BASE_RATING = 1000, POINTS_PER_WIN = 25, POINTS_PER_LOSS = 15;
function computeRating(wins, losses) {
  const w = Number(wins) || 0, l = Number(losses) || 0;
  return BASE_RATING + w * POINTS_PER_WIN - l * POINTS_PER_LOSS;
}

function emptyPlayer() {
  return { id: null, name: "", gender: "M", wins: 0, losses: 0, city: "Югорск", photo: null };
}

function fileToCompressedDataUrl(file, size = 320, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function PointsStrip() {
  const tris = new Array(18).fill(0);
  return (
    <div style={{ display: "flex", width: "100%", height: 22, background: COLORS.bgDark, borderTop: "1px solid #25272C" }} aria-hidden="true">
      {tris.map((_, i) => (
        <div key={i} style={{ flex: 1, height: "100%", background: i % 2 === 0 ? COLORS.gold : COLORS.woodMid, clipPath: "polygon(50% 100%, 0 0, 100% 0)", opacity: i % 2 === 0 ? 0.55 : 0.28 }} />
      ))}
    </div>
  );
}

function SectionLabel({ icon, children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
      <div style={{ width: 34, height: 34, borderRadius: 8, background: COLORS.felt, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 16 }}>{icon}</div>
      <h2 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 26, color: COLORS.cream, margin: 0 }}>{children}</h2>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block" }}>
      <span style={{ display: "block", fontSize: 12.5, color: COLORS.creamDim, marginBottom: 5, fontWeight: 600 }}>{label}</span>
      {children}
    </label>
  );
}

function IconButton({ children, onClick, title, danger }) {
  return (
    <button onClick={onClick} title={title} style={{ background: "transparent", border: `1px solid ${danger ? "#5A2A2A" : "#33363C"}`, color: danger ? "#D98B8B" : COLORS.creamDim, borderRadius: 7, padding: "6px 9px", display: "flex", alignItems: "center", fontSize: 14 }}>
      {children}
    </button>
  );
}

function EmptyState({ onAdd, label, buttonLabel }) {
  return (
    <div style={{ border: "1px dashed #33363C", borderRadius: 14, padding: "44px 20px", textAlign: "center", color: COLORS.creamDim }}>
      <div style={{ fontSize: 26, marginBottom: 10 }}>🎲</div>
      <p style={{ margin: "0 0 16px" }}>{label}</p>
      {onAdd && <button onClick={onAdd} style={{ background: COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 9, padding: "9px 16px", fontWeight: 700, fontSize: 13.5 }}>{buttonLabel}</button>}
    </div>
  );
}

// Показывается, пока в CONFIG не вставлены настоящие данные Supabase.
function SetupNeeded() {
  return (
    <div style={{ minHeight: "100vh", background: COLORS.bgDark, color: COLORS.cream, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "'Manrope', sans-serif" }}>
      <div style={{ maxWidth: 480, background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 16, padding: 30 }}>
        <div style={{ fontSize: 28, marginBottom: 12 }}>🎲</div>
        <h1 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 22, margin: "0 0 12px" }}>Нужно подключить базу данных</h1>
        <p style={{ color: COLORS.creamDim, fontSize: 14, lineHeight: 1.6 }}>
          Откройте файл <code>index.html</code>, найдите блок «НАСТРОЙКА» в начале скрипта и вставьте туда
          <b> SUPABASE_URL</b> и <b>SUPABASE_ANON_KEY</b> вашего проекта Supabase. Подробности — в файле README.md.
        </p>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("home");
  const [ratingFilter, setRatingFilter] = useState("all");
  const [fed, setFed] = useState(null);
  const [players, setPlayers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [isAdmin, setIsAdmin] = useState(false);
  const [showAuthModal, setShowAuthModal] = useState(false);
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authError, setAuthError] = useState("");
  const [authBusy, setAuthBusy] = useState(false);

  const [editingFed, setEditingFed] = useState(false);
  const [fedDraft, setFedDraft] = useState(null);

  const [showPlayerForm, setShowPlayerForm] = useState(false);
  const [playerDraft, setPlayerDraft] = useState(emptyPlayer());
  const [savingPlayer, setSavingPlayer] = useState(false);
  const fileInputRef = useRef(null);

  async function loadFederation() {
    const { data, error } = await db.from("federation_info").select("*").eq("id", 1).single();
    if (error) { setError("Не удалось загрузить сведения о федерации."); return; }
    setFed(data);
  }

  async function loadPlayers() {
    const { data, error } = await db.from("players").select("*").order("name");
    if (error) { setError("Не удалось загрузить список игроков."); return; }
    setPlayers(data || []);
  }

  useEffect(() => {
    (async () => {
      try {
        const { data } = await db.auth.getSession();
        setIsAdmin(!!data.session);
      } catch (e) {}
      try {
        await Promise.all([loadFederation(), loadPlayers()]);
      } catch (e) {
        setError("Не удалось связаться с базой данных: " + (e && e.message ? e.message : String(e)));
      }
      setLoading(false);
    })();

    const { data: authSub } = db.auth.onAuthStateChange((_event, session) => setIsAdmin(!!session));

    const channel = db
      .channel("public-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "players" }, () => loadPlayers())
      .on("postgres_changes", { event: "*", schema: "public", table: "federation_info" }, () => loadFederation())
      .subscribe();

    return () => { authSub.subscription.unsubscribe(); db.removeChannel(channel); };
  }, []);

  function openAuthModal() { setAuthEmail(""); setAuthPassword(""); setAuthError(""); setShowAuthModal(true); }

  async function submitAuth() {
    setAuthError(""); setAuthBusy(true);
    const { error } = await db.auth.signInWithPassword({ email: authEmail, password: authPassword });
    setAuthBusy(false);
    if (error) { setAuthError("Неверный email или пароль."); return; }
    setShowAuthModal(false);
  }

  async function logout() { await db.auth.signOut(); }

  function openNewPlayerForm() { setPlayerDraft(emptyPlayer()); setShowPlayerForm(true); }
  function openEditPlayerForm(p) { setPlayerDraft({ ...p }); setShowPlayerForm(true); }

  async function handlePhotoSelect(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      setPlayerDraft((d) => ({ ...d, photo: dataUrl }));
    } catch (err) { setError("Не удалось обработать фотографию."); }
  }

  async function saveDraftPlayer() {
    if (!playerDraft.name.trim()) return;
    setSavingPlayer(true);
    const payload = {
      name: playerDraft.name, gender: playerDraft.gender,
      wins: Number(playerDraft.wins) || 0, losses: Number(playerDraft.losses) || 0,
      city: playerDraft.city, photo: playerDraft.photo,
    };
    const { error } = playerDraft.id
      ? await db.from("players").update(payload).eq("id", playerDraft.id)
      : await db.from("players").insert(payload);
    setSavingPlayer(false);
    if (error) { setError("Не удалось сохранить игрока: " + error.message); return; }
    await loadPlayers();
    setShowPlayerForm(false);
  }

  async function deletePlayer(id) {
    const { error } = await db.from("players").delete().eq("id", id);
    if (error) { setError("Не удалось удалить игрока: " + error.message); return; }
    await loadPlayers();
  }

  async function saveFed() {
    const { id, updated_at, ...payload } = fedDraft;
    const { error } = await db.from("federation_info").update(payload).eq("id", 1);
    if (error) { setError("Не удалось сохранить сведения: " + error.message); return; }
    setFed(fedDraft);
    setEditingFed(false);
  }

  if (!CONFIG_OK) return <SetupNeeded />;

  const withRating = players.map((p) => ({ ...p, rating: computeRating(p.wins, p.losses) }));
  const ranked = [...withRating].sort((a, b) => b.rating - a.rating);
  const rankedFiltered = ratingFilter === "all" ? ranked : ranked.filter((p) => p.gender === ratingFilter);

  const navItems = [
    { id: "home", label: "Главная", icon: "🎲" },
    { id: "federation", label: "Федерация", icon: "ℹ️" },
    { id: "players", label: "Игроки", icon: "👥" },
    { id: "rating", label: "Рейтинг", icon: "🏆" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bgDark, color: COLORS.cream }}>
      <header style={{ position: "sticky", top: 0, zIndex: 40, background: "rgba(10,10,12,0.85)", backdropFilter: "blur(6px)", borderBottom: "1px solid #25272C" }}>
        <div style={{ maxWidth: 1040, margin: "0 auto", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 36, height: 36, borderRadius: 9, background: `linear-gradient(135deg, ${COLORS.gold}, ${COLORS.woodMid2})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🎲</div>
            <span style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 17, letterSpacing: "-0.01em" }}>Нарды Югорска</span>
          </div>
          <nav style={{ display: "flex", gap: 4, flexWrap: "wrap", alignItems: "center" }}>
            {navItems.map((n) => (
              <button key={n.id} onClick={() => setTab(n.id)} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 13px", borderRadius: 8, border: "none", background: tab === n.id ? COLORS.felt : "transparent", color: tab === n.id ? COLORS.goldSoft : COLORS.creamDim, fontSize: 14, fontWeight: 600 }}>
                <span>{n.icon}</span>{n.label}
              </button>
            ))}
            <div style={{ width: 1, height: 22, background: "#25272C", margin: "0 4px" }} />
            {isAdmin ? (
              <button onClick={logout} title="Выйти" style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1px solid ${COLORS.gold}`, background: "rgba(176,141,70,0.14)", color: COLORS.goldSoft, fontSize: 13, fontWeight: 700 }}>
                🔓 Редактор
              </button>
            ) : (
              <button onClick={openAuthModal} title="Войти" style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: "1px solid #33363C", background: "transparent", color: COLORS.creamDim, fontSize: 13, fontWeight: 600 }}>
                🔒 Вход
              </button>
            )}
          </nav>
        </div>
      </header>

      {error && (
        <div style={{ background: COLORS.burgundy, color: COLORS.cream, padding: "10px 20px", fontSize: 13, textAlign: "center" }} onClick={() => setError(null)}>
          {error} <span style={{ opacity: 0.7 }}>(нажмите, чтобы скрыть)</span>
        </div>
      )}

      {loading ? (
        <div style={{ padding: 60, textAlign: "center", color: COLORS.creamDim }}>Загрузка…</div>
      ) : !fed ? (
        <div style={{ padding: 60, textAlign: "center", color: COLORS.creamDim, maxWidth: 480, margin: "0 auto" }}>
          Не получилось загрузить сведения о федерации из базы данных.<br />
          Проверьте, что в таблице <b>federation_info</b> есть строка с <b>id = 1</b>, и что политики доступа (RLS) разрешают чтение.
        </div>
      ) : (
        <>
          {tab === "home" && (
            <div className="fade-in">
              <section style={{ position: "relative", overflow: "hidden", background: `radial-gradient(ellipse at 30% 20%, ${COLORS.woodMid2} 0%, ${COLORS.bgDark} 65%)` }}>
                <div style={{ maxWidth: 1040, margin: "0 auto", padding: "76px 24px 48px", display: "grid", gridTemplateColumns: "1.2fr 0.8fr", gap: 30, alignItems: "center" }}>
                  <div>
                    <p style={{ color: COLORS.goldSoft, fontSize: 14, fontWeight: 600, marginBottom: 14 }}>Ханты-Мансийский автономный округ — Югра</p>
                    <h1 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: "clamp(32px, 5vw, 50px)", lineHeight: 1.05, letterSpacing: "-0.02em", margin: "0 0 18px" }}>{fed.name}</h1>
                    <p style={{ fontSize: 16.5, lineHeight: 1.65, color: COLORS.creamDim, maxWidth: 500 }}>{fed.description}</p>
                    <div style={{ display: "flex", gap: 12, marginTop: 28, flexWrap: "wrap" }}>
                      <button onClick={() => setTab("rating")} style={{ background: COLORS.gold, color: COLORS.bgDark, border: "none", padding: "12px 22px", borderRadius: 9, fontWeight: 700, fontSize: 14.5 }}>Смотреть рейтинг</button>
                      <button onClick={() => setTab("players")} style={{ background: "transparent", color: COLORS.cream, border: "1px solid #33363C", padding: "12px 22px", borderRadius: 9, fontWeight: 600, fontSize: 14.5 }}>Все игроки</button>
                    </div>
                  </div>
                  <div style={{ aspectRatio: "1", borderRadius: 14, background: COLORS.felt, border: "1px solid #25272C", boxShadow: "inset 0 0 0 1px rgba(217,188,124,0.06)", display: "grid", gridTemplateRows: "1fr auto 1fr", overflow: "hidden", padding: 16 }}>
                    <div style={{ display: "flex", gap: 3 }}>{new Array(6).fill(0).map((_, i) => <div key={i} style={{ flex: 1, clipPath: "polygon(50% 100%, 22% 0, 78% 0)", background: i % 2 === 0 ? COLORS.gold : COLORS.woodMid, opacity: i % 2 === 0 ? 0.85 : 0.45 }} />)}</div>
                    <div style={{ height: 1, background: "#25272C", margin: "12px 0" }} />
                    <div style={{ display: "flex", gap: 3, transform: "scaleY(-1)" }}>{new Array(6).fill(0).map((_, i) => <div key={i} style={{ flex: 1, clipPath: "polygon(50% 100%, 22% 0, 78% 0)", background: i % 2 === 0 ? COLORS.woodMid : COLORS.gold, opacity: i % 2 === 0 ? 0.45 : 0.85 }} />)}</div>
                  </div>
                </div>
                <PointsStrip />
              </section>
              <section style={{ maxWidth: 1040, margin: "0 auto", padding: "50px 24px" }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16 }}>
                  {[
                    { label: "Игроков в федерации", value: fed.member_count ?? players.length },
                    { label: "Средний рейтинг", value: withRating.length ? Math.round(withRating.reduce((s, p) => s + p.rating, 0) / withRating.length) : "—" },
                    { label: "Год основания", value: fed.founded },
                    { label: "Лидер общего рейтинга", value: ranked[0] ? ranked[0].name : "—", small: true },
                  ].map((s, i) => (
                    <div key={i} style={{ background: "#141518", border: "1px solid #25272C", borderRadius: 12, padding: "18px 16px" }}>
                      <div style={{ fontFamily: "'Manrope', sans-serif", fontSize: s.small ? 20 : 28, fontWeight: 800, letterSpacing: "-0.01em", color: COLORS.goldSoft }}>{s.value}</div>
                      <div style={{ fontSize: 13, color: COLORS.creamDim, marginTop: 4 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
              </section>
            </div>
          )}

          {tab === "federation" && (
            <section className="fade-in" style={{ maxWidth: 760, margin: "0 auto", padding: "44px 24px 80px" }}>
              <SectionLabel icon="ℹ️">О федерации</SectionLabel>
              {!editingFed ? (
                <div style={{ background: "#141518", border: "1px solid #25272C", borderRadius: 14, padding: 26 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                    <h3 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 22, margin: "0 0 6px" }}>{fed.name}</h3>
                    {isAdmin && <button onClick={() => { setFedDraft(fed); setEditingFed(true); }} style={{ background: "transparent", border: "1px solid #33363C", color: COLORS.goldSoft, borderRadius: 8, padding: "7px 12px", display: "flex", alignItems: "center", gap: 6, fontSize: 13, height: "fit-content", flexShrink: 0 }}>✎ Редактировать</button>}
                  </div>
                  <p style={{ color: COLORS.creamDim, lineHeight: 1.7, fontSize: 15 }}>{fed.description}</p>
                  <div style={{ display: "grid", gap: 10, marginTop: 18, fontSize: 14 }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "center", color: COLORS.creamDim }}>📅 Основана в {fed.founded} году</div>
                    <div style={{ display: "flex", gap: 10, alignItems: "center", color: COLORS.creamDim }}>📍 {fed.address}</div>
                    <div style={{ display: "flex", gap: 10, alignItems: "center", color: COLORS.creamDim }}>☎ {fed.phone} · {fed.email}</div>
                  </div>
                  {isAdmin && <p style={{ marginTop: 20, fontSize: 12, color: COLORS.creamDim }}>Чтобы дать доступ на редактирование другому человеку, добавьте его email в Supabase → Authentication → Users.</p>}
                </div>
              ) : (
                <div style={{ background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 14, padding: 26, display: "grid", gap: 14 }}>
                  <Field label="Название федерации"><input value={fedDraft.name} onChange={(e) => setFedDraft({ ...fedDraft, name: e.target.value })} /></Field>
                  <Field label="Описание"><textarea value={fedDraft.description} onChange={(e) => setFedDraft({ ...fedDraft, description: e.target.value })} /></Field>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                    <Field label="Год основания"><input value={fedDraft.founded} onChange={(e) => setFedDraft({ ...fedDraft, founded: e.target.value })} /></Field>
                    <Field label="Телефон"><input value={fedDraft.phone} onChange={(e) => setFedDraft({ ...fedDraft, phone: e.target.value })} /></Field>
                  </div>
                  <Field label="Игроков в клубе (общее число)"><input type="number" value={fedDraft.member_count ?? 0} onChange={(e) => setFedDraft({ ...fedDraft, member_count: parseInt(e.target.value || "0", 10) })} /></Field>
                  <Field label="Адрес"><input value={fedDraft.address} onChange={(e) => setFedDraft({ ...fedDraft, address: e.target.value })} /></Field>
                  <Field label="Email"><input value={fedDraft.email} onChange={(e) => setFedDraft({ ...fedDraft, email: e.target.value })} /></Field>
                  <div style={{ display: "flex", gap: 10, marginTop: 6 }}>
                    <button onClick={saveFed} style={{ background: COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 8, padding: "10px 18px", fontWeight: 700, display: "flex", alignItems: "center", gap: 6, fontSize: 14 }}>✓ Сохранить</button>
                    <button onClick={() => setEditingFed(false)} style={{ background: "transparent", color: COLORS.creamDim, border: "1px solid #33363C", borderRadius: 8, padding: "10px 18px", fontSize: 14 }}>Отмена</button>
                  </div>
                </div>
              )}
            </section>
          )}

          {tab === "players" && (
            <section className="fade-in" style={{ maxWidth: 1040, margin: "0 auto", padding: "44px 24px 80px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
                <SectionLabel icon="👥">Игроки федерации</SectionLabel>
                {isAdmin && <button onClick={openNewPlayerForm} style={{ background: COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 9, padding: "10px 16px", fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 6, marginBottom: 22, height: "fit-content" }}>＋ Добавить игрока</button>}
              </div>
              {!isAdmin && <p style={{ color: COLORS.creamDim, fontSize: 13, marginTop: -10, marginBottom: 20 }}>Просмотр открыт всем. Чтобы добавлять и редактировать игроков, войдите под своей учётной записью.</p>}
              {players.length === 0 ? (
                <EmptyState onAdd={isAdmin ? openNewPlayerForm : null} label="Пока нет ни одного игрока." buttonLabel="Добавить первого игрока" />
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
                  {withRating.map((p) => (
                    <div key={p.id} className="card-hover" style={{ background: "#141518", border: "1px solid #25272C", borderRadius: 14, padding: 16, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
                      <div style={{ width: 84, height: 84, borderRadius: "50%", background: p.photo ? `url(${p.photo}) center/cover` : COLORS.felt, border: `2px solid ${COLORS.gold}`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 12, flexShrink: 0 }}>
                        {!p.photo && <span style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 700, fontSize: 26, color: COLORS.goldSoft }}>{p.name ? p.name.trim()[0].toUpperCase() : "?"}</span>}
                      </div>
                      <div style={{ fontWeight: 700, fontSize: 15 }}>{p.name}</div>
                      <div style={{ fontSize: 12.5, color: COLORS.creamDim, marginTop: 2 }}>{p.city} · {p.gender === "F" ? "жен." : "муж."}</div>
                      <div style={{ marginTop: 10, background: COLORS.feltDark, color: COLORS.goldSoft, borderRadius: 999, padding: "4px 12px", fontSize: 13, fontWeight: 700 }}>{p.rating} очк.</div>
                      <div style={{ fontSize: 12, color: COLORS.creamDim, marginTop: 6 }}>{p.wins}П – {p.losses}П · {Number(p.wins) + Number(p.losses)} игр</div>
                      {isAdmin && <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                        <IconButton onClick={() => openEditPlayerForm(p)} title="Редактировать">✎</IconButton>
                        <IconButton onClick={() => deletePlayer(p.id)} title="Удалить" danger>🗑</IconButton>
                      </div>}
                    </div>
                  ))}
                </div>
              )}
            </section>
          )}

          {tab === "rating" && (
            <section className="fade-in" style={{ maxWidth: 760, margin: "0 auto", padding: "44px 24px 80px" }}>
              <SectionLabel icon="🏆">Рейтинг игроков</SectionLabel>
              <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
                {[{ id: "all", label: "Общий" }, { id: "M", label: "Мужчины" }, { id: "F", label: "Женщины" }].map((f) => (
                  <button key={f.id} onClick={() => setRatingFilter(f.id)} style={{ padding: "7px 14px", borderRadius: 999, border: `1px solid ${ratingFilter === f.id ? COLORS.gold : "#33363C"}`, background: ratingFilter === f.id ? "rgba(176,141,70,0.16)" : "transparent", color: ratingFilter === f.id ? COLORS.goldSoft : COLORS.creamDim, fontSize: 13, fontWeight: 700 }}>{f.label}</button>
                ))}
              </div>
              <p style={{ fontSize: 12.5, color: COLORS.creamDim, marginTop: -6, marginBottom: 18 }}>Рейтинг считается автоматически: {BASE_RATING} стартовых очков + {POINTS_PER_WIN} за победу − {POINTS_PER_LOSS} за поражение.</p>
              {rankedFiltered.length === 0 ? (
                <EmptyState onAdd={() => setTab("players")} label="Пока никого в этой категории." buttonLabel="Перейти к игрокам" />
              ) : (
                <div style={{ background: "#141518", border: "1px solid #25272C", borderRadius: 14, overflow: "hidden" }}>
                  {rankedFiltered.map((p, i) => (
                    <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 14, padding: "13px 18px", borderBottom: i === rankedFiltered.length - 1 ? "none" : "1px solid #25272C", background: i < 3 ? "rgba(176,141,70,0.07)" : "transparent" }}>
                      <div style={{ width: 28, textAlign: "center", fontWeight: 800, fontFamily: "'Manrope', sans-serif", fontSize: 16, color: i === 0 ? COLORS.gold : i === 1 ? "#C7C7C7" : i === 2 ? "#C08A50" : COLORS.creamDim, flexShrink: 0 }}>
                        {i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}
                      </div>
                      <div style={{ width: 40, height: 40, borderRadius: "50%", background: p.photo ? `url(${p.photo}) center/cover` : COLORS.felt, flexShrink: 0, border: "1px solid #33363C" }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 700, fontSize: 14.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                        <div style={{ fontSize: 12, color: COLORS.creamDim }}>{p.wins}П – {p.losses}П</div>
                      </div>
                      <div style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 700, fontSize: 18, color: COLORS.goldSoft, flexShrink: 0 }}>{p.rating}</div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          )}
        </>
      )}

      {showPlayerForm && isAdmin && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(6,6,8,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 60 }} onClick={() => setShowPlayerForm(false)}>
          <div onClick={(e) => e.stopPropagation()} className="fade-in" style={{ background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 16, width: "100%", maxWidth: 420, maxHeight: "88vh", overflowY: "auto", padding: 24 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <h3 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 20, margin: 0 }}>{playerDraft.id ? "Изменить игрока" : "Новый игрок"}</h3>
              <button onClick={() => setShowPlayerForm(false)} style={{ background: "transparent", border: "none", color: COLORS.creamDim, fontSize: 18 }}>✕</button>
            </div>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
              <div onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ width: 96, height: 96, borderRadius: "50%", background: playerDraft.photo ? `url(${playerDraft.photo}) center/cover` : COLORS.felt, border: `2px dashed ${COLORS.gold}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexDirection: "column", gap: 4 }}>
                {!playerDraft.photo && <span style={{ fontSize: 20 }}>📷</span>}
                {!playerDraft.photo && <span style={{ fontSize: 10.5, color: COLORS.goldSoft }}>фото</span>}
              </div>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handlePhotoSelect} style={{ display: "none" }} />
            </div>
            <div style={{ display: "grid", gap: 12 }}>
              <Field label="Имя и фамилия"><input value={playerDraft.name} onChange={(e) => setPlayerDraft({ ...playerDraft, name: e.target.value })} placeholder="Например, Иван Петров" /></Field>
              <Field label="Пол">
                <div style={{ display: "flex", gap: 8 }}>
                  {[{ id: "M", label: "Мужской" }, { id: "F", label: "Женский" }].map((g) => (
                    <button key={g.id} type="button" onClick={() => setPlayerDraft({ ...playerDraft, gender: g.id })} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: `1px solid ${playerDraft.gender === g.id ? COLORS.gold : "#25272C"}`, background: playerDraft.gender === g.id ? "rgba(176,141,70,0.16)" : "#0F1013", color: playerDraft.gender === g.id ? COLORS.goldSoft : COLORS.creamDim, fontSize: 13.5, fontWeight: 600 }}>{g.label}</button>
                  ))}
                </div>
              </Field>
              <Field label="Город"><input value={playerDraft.city} onChange={(e) => setPlayerDraft({ ...playerDraft, city: e.target.value })} /></Field>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="Победы"><input type="number" min="0" value={playerDraft.wins} onChange={(e) => setPlayerDraft({ ...playerDraft, wins: Math.max(0, Number(e.target.value)) })} /></Field>
                <Field label="Поражения"><input type="number" min="0" value={playerDraft.losses} onChange={(e) => setPlayerDraft({ ...playerDraft, losses: Math.max(0, Number(e.target.value)) })} /></Field>
              </div>
              <div style={{ background: COLORS.feltDark, borderRadius: 8, padding: "10px 12px", fontSize: 13, color: COLORS.creamDim, display: "flex", justifyContent: "space-between" }}>
                <span>Игр: {Number(playerDraft.wins) + Number(playerDraft.losses)}</span>
                <span style={{ color: COLORS.goldSoft, fontWeight: 700 }}>Рейтинг: {computeRating(playerDraft.wins, playerDraft.losses)}</span>
              </div>
            </div>
            <button disabled={!playerDraft.name.trim() || savingPlayer} onClick={saveDraftPlayer} style={{ marginTop: 20, width: "100%", background: !playerDraft.name.trim() ? "#33363C" : COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 9, padding: "11px 0", fontWeight: 700, fontSize: 14.5, opacity: savingPlayer ? 0.7 : 1 }}>
              {savingPlayer ? "Сохранение…" : "Сохранить игрока"}
            </button>
          </div>
        </div>
      )}

      {showAuthModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(6,6,8,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 70 }} onClick={() => setShowAuthModal(false)}>
          <div onClick={(e) => e.stopPropagation()} className="fade-in" style={{ background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 16, width: "100%", maxWidth: 360, padding: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <span style={{ fontSize: 18 }}>🔑</span>
              <h3 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 19, margin: 0 }}>Вход для редакторов</h3>
            </div>
            <p style={{ fontSize: 12.5, color: COLORS.creamDim, lineHeight: 1.5, marginBottom: 16 }}>
              Войдите под учётной записью, которую вам выдал администратор федерации (создаётся в Supabase → Authentication → Users).
            </p>
            <div style={{ display: "grid", gap: 10 }}>
              <Field label="Email"><input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} autoFocus /></Field>
              <Field label="Пароль"><input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} /></Field>
            </div>
            {authError && <p style={{ color: "#E39A9A", fontSize: 12.5, marginTop: 10 }}>{authError}</p>}
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <button disabled={authBusy} onClick={submitAuth} style={{ flex: 1, background: COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 8, padding: "10px 0", fontWeight: 700, fontSize: 14, opacity: authBusy ? 0.7 : 1 }}>{authBusy ? "Проверка…" : "Войти"}</button>
              <button onClick={() => setShowAuthModal(false)} style={{ background: "transparent", color: COLORS.creamDim, border: "1px solid #33363C", borderRadius: 8, padding: "10px 16px", fontSize: 14 }}>Отмена</button>
            </div>
          </div>
        </div>
      )}

      {fed && <footer style={{ borderTop: "1px solid #25272C", padding: "22px 24px", textAlign: "center", fontSize: 12.5, color: COLORS.creamDim }}>{fed.name} · {fed.address}</footer>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
