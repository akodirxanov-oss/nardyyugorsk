<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bgDark:#0A0A0C; --surface:#141518; --surfaceRaised:#1A1C20; --line:#25272C;
    --slate:#3E5C60; --slateDim:#2A3E41; --brass:#B08D46; --brassSoft:#D9BC7C;
    --cream:#EDEAE3; --creamDim:#8B8E94; --danger:#C1595A;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bgDark); }
  body{ font-family:'Manrope',sans-serif; color:var(--cream); }
  ::selection{ background:var(--brass); color:var(--bgDark); }
  input, textarea{
    font-family:'Manrope',sans-serif; background:#0F1013; border:1px solid #25272C;
    color:var(--cream); border-radius:8px; padding:9px 12px; font-size:14px; outline:none; width:100%;
  }
  input:focus, textarea:focus{ border-color:var(--brass); }
  textarea{ resize:vertical; min-height:90px; line-height:1.5; }
  button{ font-family:'Manrope',sans-serif; cursor:pointer; }
  button:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  .fade-in{ animation: fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .card-hover{ transition: transform .18s ease, border-color .18s ease; }
  .card-hover:hover{ transform: translateY(-3px); border-color: var(--brass); }
  @media (max-width: 760px){
    .hero-grid{ grid-template-columns: 1fr !important; padding-top: 44px !important; }
    .hero-grid > div:last-child{ max-width: 380px; margin: 0 auto; width: 100%; }
    nav.main-nav{ gap: 2px !important; }
    nav.main-nav button{ padding: 7px 9px !important; font-size: 13px !important; }
    nav.main-nav button span:first-child{ display: none; }
  }
</style>

const BASE_RATING = 1000, POINTS_PER_WIN = 25, POINTS_PER_LOSS = 15;
const PLACE_BONUS = { 1: 100, 2: 50, 3: 30 };
function computeRating(wins, losses, bonus) {
  const w = Number(wins) || 0, l = Number(losses) || 0, b = Number(bonus) || 0;
  return BASE_RATING + w * POINTS_PER_WIN - l * POINTS_PER_LOSS + b;
}

function formatTournamentDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const datePart = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  const timePart = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return `${datePart}, ${timePart}`;
}

function fileToCompressedDataUrl(file, size = 320, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function App() {
  const [tab, setTab] = useState("home");

  const [showParticipateModal, setShowParticipateModal] = useState(false);

  async function loadFederation() {
    const { data, error } = await db.from("federation_info").select("*").eq("id", 1).single();
    if (error) { setError("Не удалось загрузить сведения о федерации."); return; }
    setFed(data);
  }

  async function loadPlayers() {
    const { data, error } = await db.from("players").select("*").order("name");
    if (error) { setError("Не удалось загрузить список игроков."); return; }
    setPlayers(data || []);
  }

  async function loadTournaments() {
    const { data, error } = await db.from("tournaments").select("*").order("start_time");
    if (error) { setError("Не удалось загрузить турниры."); return; }
    setTournaments(data || []);
  }

  useEffect(() => {
    (async () => {
      try {
        const { data } = await db.auth.getSession();
        setIsAdmin(!!data.session);
      } catch (e) {}
      try {
        await Promise.all([loadFederation(), loadPlayers(), loadTournaments()]);
      } catch (e) {
        setError("Не удалось связаться с базой данных: " + (e && e.message ? e.message : String(e)));
      }
      setLoading(false);
    })();

    const { data: authSub } = db.auth.onAuthStateChange((_event, session) => setIsAdmin(!!session));

    const channel = db
      .channel("public-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "players" }, () => loadPlayers())
      .on("postgres_changes", { event: "*", schema: "public", table: "federation_info" }, () => loadFederation())
      .on("postgres_changes", { event: "*", schema: "public", table: "tournaments" }, () => loadTournaments())
      .subscribe();

    return () => { authSub.subscription.unsubscribe(); db.removeChannel(channel); };
  }, []);

  function openAuthModal() { setAuthEmail(""); setAuthPassword(""); setAuthError(""); setShowAuthModal(true); }

  async function submitAuth() {
    setAuthError(""); setAuthBusy(true);
    const { error } = await db.auth.signInWithPassword({ email: authEmail, password: authPassword });
    setAuthBusy(false);
    if (error) { setAuthError("Неверный email или пароль."); return; }

  async function applyPlacementBonusDeltas(oldPlacements, newPlacements) {
    const deltas = {};
    const add = (id, amt) => { if (id) deltas[id] = (deltas[id] || 0) + amt; };
    [1, 2, 3].forEach((place) => {
      const oldId = oldPlacements[place], newId = newPlacements[place];
      if (oldId !== newId) { add(oldId, -PLACE_BONUS[place]); add(newId, PLACE_BONUS[place]); }
    });
    const ids = Object.keys(deltas).filter((id) => deltas[id] !== 0);
    if (!ids.length) return;
    const { data: rows } = await db.from("players").select("id, bonus_points").in("id", ids);
    for (const row of rows || []) {
      const next = Math.max(0, (row.bonus_points || 0) + deltas[row.id]);
      await db.from("players").update({ bonus_points: next }).eq("id", row.id);
    }
  }

  async function saveDraftTournament() {
    if (!tournamentDraft.title.trim() || !tournamentDraft.start_time) return;
    setSavingTournament(true);
    const payload = {
      title: tournamentDraft.title, description: tournamentDraft.description,
      start_time: new Date(tournamentDraft.start_time).toISOString(),
      location: tournamentDraft.location, status: tournamentDraft.status,
      first_place_id: tournamentDraft.first_place_id || null,
      second_place_id: tournamentDraft.second_place_id || null,
      third_place_id: tournamentDraft.third_place_id || null,
    };
    let oldPlacements = { 1: null, 2: null, 3: null };
    if (tournamentDraft.id) {
      const { data: prev } = await db.from("tournaments").select("first_place_id, second_place_id, third_place_id").eq("id", tournamentDraft.id).single();
      if (prev) oldPlacements = { 1: prev.first_place_id, 2: prev.second_place_id, 3: prev.third_place_id };
    }
    const newPlacements = { 1: payload.first_place_id, 2: payload.second_place_id, 3: payload.third_place_id };
    const { error } = tournamentDraft.id
      ? await db.from("tournaments").update(payload).eq("id", tournamentDraft.id)
      : await db.from("tournaments").insert(payload);
    if (error) { setSavingTournament(false); setError("Не удалось сохранить турнир: " + error.message); return; }
    await applyPlacementBonusDeltas(oldPlacements, newPlacements);
    await Promise.all([loadTournaments(), loadPlayers()]);
    setSavingTournament(false);
    setShowTournamentForm(false);
  }

  async function deleteTournament(id) {
    const { data: prev } = await db.from("tournaments").select("first_place_id, second_place_id, third_place_id").eq("id", id).single();
    if (prev) await applyPlacementBonusDeltas({ 1: prev.first_place_id, 2: prev.second_place_id, 3: prev.third_place_id }, { 1: null, 2: null, 3: null });
    const { error } = await db.from("tournaments").delete().eq("id", id);
    if (error) { setError("Не удалось удалить турнир: " + error.message); return; }
    await Promise.all([loadTournaments(), loadPlayers()]);
    if (selectedTournamentId === id) { setSelectedTournamentId(null); setTab("tournaments"); }
  }

                  {rankedFiltered.map((p, i) => (
                    <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 14, padding: "13px 18px", borderBottom: i === rankedFiltered.length - 1 ? "none" : "1px solid #25272C", background: i < 3 ? "rgba(176,141,70,0.07)" : "transparent" }}>
                      <div style={{ width: 28, textAlign: "center", fontWeight: 800, fontFamily: "'Manrope', sans-serif", fontSize: 16, color: i === 0 ? COLORS.gold : i === 1 ? "#C7C7C7" : i === 2 ? "#C08A50" : COLORS.creamDim, flexShrink: 0 }}>
                        {i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}
                      </div>
                      <div style={{ width: 40, height: 40, borderRadius: "50%", background: p.photo ? `url(${p.photo}) center/cover` : `url(${p.gender === "F" ? AVATAR_F : AVATAR_M}) center/cover`, flexShrink: 0, border: "1px solid #33363C" }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 700, fontSize: 14.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                        <div style={{ fontSize: 12, color: COLORS.creamDim }}>{p.wins}П – {p.losses}П</div>
                      </div>
                      <div style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 700, fontSize: 18, color: COLORS.goldSoft, flexShrink: 0 }}>{p.rating}</div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          )}
        </>
      )}

      {showPlayerForm && isAdmin && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(6,6,8,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 60 }} onClick={() => setShowPlayerForm(false)}>
          <div onClick={(e) => e.stopPropagation()} className="fade-in" style={{ background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 16, width: "100%", maxWidth: 420, maxHeight: "88vh", overflowY: "auto", padding: 24 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <h3 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 20, margin: 0 }}>{playerDraft.id ? "Изменить игрока" : "Новый игрок"}</h3>
              <button onClick={() => setShowPlayerForm(false)} style={{ background: "transparent", border: "none", color: COLORS.creamDim, fontSize: 18 }}>✕</button>
            </div>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
              <div onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ width: 96, height: 96, borderRadius: "50%", background: playerDraft.photo ? `url(${playerDraft.photo}) center/cover` : COLORS.felt, border: `2px dashed ${COLORS.gold}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexDirection: "column", gap: 4 }}>
                {!playerDraft.photo && <span style={{ fontSize: 20 }}>📷</span>}
                {!playerDraft.photo && <span style={{ fontSize: 10.5, color: COLORS.goldSoft }}>фото</span>}
              </div>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handlePhotoSelect} style={{ display: "none" }} />
            </div>
            <div style={{ display: "grid", gap: 12 }}>
              <Field label="Имя и фамилия"><input value={playerDraft.name} onChange={(e) => setPlayerDraft({ ...playerDraft, name: e.target.value })} placeholder="Например, Иван Петров" /></Field>
              <Field label="Пол">
                <div style={{ display: "flex", gap: 8 }}>
                  {[{ id: "M", label: "Мужской" }, { id: "F", label: "Женский" }].map((g) => (
                    <button key={g.id} type="button" onClick={() => setPlayerDraft({ ...playerDraft, gender: g.id })} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: `1px solid ${playerDraft.gender === g.id ? COLORS.gold : "#25272C"}`, background: playerDraft.gender === g.id ? "rgba(176,141,70,0.16)" : "#0F1013", color: playerDraft.gender === g.id ? COLORS.goldSoft : COLORS.creamDim, fontSize: 13.5, fontWeight: 600 }}>{g.label}</button>
                  ))}
                </div>
              </Field>
              <Field label="Город"><input value={playerDraft.city} onChange={(e) => setPlayerDraft({ ...playerDraft, city: e.target.value })} /></Field>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="Победы"><input type="number" min="0" value={playerDraft.wins} onChange={(e) => setPlayerDraft({ ...playerDraft, wins: Math.max(0, Number(e.target.value)) })} /></Field>
                <Field label="Поражения"><input type="number" min="0" value={playerDraft.losses} onChange={(e) => setPlayerDraft({ ...playerDraft, losses: Math.max(0, Number(e.target.value)) })} /></Field>
              </div>
              <div style={{ background: COLORS.feltDark, borderRadius: 8, padding: "10px 12px", fontSize: 13, color: COLORS.creamDim, display: "flex", justifyContent: "space-between" }}>
                <span>Игр: {Number(playerDraft.wins) + Number(playerDraft.losses)}</span>
                <span style={{ color: COLORS.goldSoft, fontWeight: 700 }}>Рейтинг: {computeRating(playerDraft.wins, playerDraft.losses, playerDraft.bonus_points)}</span>
              </div>
              {!!playerDraft.bonus_points && (
                <p style={{ fontSize: 12, color: COLORS.creamDim, margin: 0 }}>Бонус за призовые места: +{playerDraft.bonus_points} (начисляется автоматически из турниров, вручную не редактируется).</p>
              )}
            </div>
            <button disabled={!playerDraft.name.trim() || savingPlayer} onClick={saveDraftPlayer} style={{ marginTop: 20, width: "100%", background: !playerDraft.name.trim() ? "#33363C" : COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 9, padding: "11px 0", fontWeight: 700, fontSize: 14.5, opacity: savingPlayer ? 0.7 : 1 }}>
              {savingPlayer ? "Сохранение…" : "Сохранить игрока"}
            </button>
          </div>
        </div>
      )}

      {showParticipateModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(6,6,8,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 70 }} onClick={() => setShowParticipateModal(false)}>
          <div onClick={(e) => e.stopPropagation()} className="fade-in" style={{ background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 16, width: "100%", maxWidth: 360, padding: 24 }}>
            <h3 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 19, margin: "0 0 6px" }}>Как с вами связаться?</h3>
            <p style={{ fontSize: 12.5, color: COLORS.creamDim, lineHeight: 1.5, marginBottom: 18 }}>Выберите удобный способ — откроется чат с организатором турнира.</p>
            <div style={{ display: "grid", gap: 10 }}>
              <a href={VK_CONTACT_URL} target="_blank" rel="noopener noreferrer" onClick={() => setShowParticipateModal(false)} style={{ display: "block", textAlign: "center", background: COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 700, fontSize: 14.5, textDecoration: "none" }}>ВКонтакте</a>
              <a href={TG_CONTACT_URL} target="_blank" rel="noopener noreferrer" onClick={() => setShowParticipateModal(false)} style={{ display: "block", textAlign: "center", background: "transparent", color: COLORS.cream, border: "1px solid #33363C", borderRadius: 8, padding: "11px 0", fontWeight: 700, fontSize: 14.5, textDecoration: "none" }}>Telegram</a>
            </div>
            <button onClick={() => setShowParticipateModal(false)} style={{ marginTop: 14, width: "100%", background: "transparent", color: COLORS.creamDim, border: "none", fontSize: 13 }}>Отмена</button>
          </div>
        </div>
      )}

      {showTournamentForm && isAdmin && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(6,6,8,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 60 }} onClick={() => setShowTournamentForm(false)}>
          <div onClick={(e) => e.stopPropagation()} className="fade-in" style={{ background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 16, width: "100%", maxWidth: 420, maxHeight: "88vh", overflowY: "auto", padding: 24 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <h3 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 20, margin: 0 }}>{tournamentDraft.id ? "Изменить турнир" : "Новый турнир"}</h3>
              <button onClick={() => setShowTournamentForm(false)} style={{ background: "transparent", border: "none", color: COLORS.creamDim, fontSize: 18 }}>✕</button>
            </div>
            <div style={{ display: "grid", gap: 12 }}>
              <Field label="Название турнира"><input value={tournamentDraft.title} onChange={(e) => setTournamentDraft({ ...tournamentDraft, title: e.target.value })} placeholder="Например, Третий турнир Федерации" /></Field>
              <Field label="Дата и время"><input type="datetime-local" value={tournamentDraft.start_time} onChange={(e) => setTournamentDraft({ ...tournamentDraft, start_time: e.target.value })} /></Field>
              <Field label="Место проведения"><input value={tournamentDraft.location} onChange={(e) => setTournamentDraft({ ...tournamentDraft, location: e.target.value })} /></Field>
              <Field label="Статус">
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {TOURNAMENT_STATUSES.map((s) => (
                    <button key={s.id} type="button" onClick={() => setTournamentDraft({ ...tournamentDraft, status: s.id })} style={{ padding: "9px 6px", borderRadius: 8, border: `1px solid ${tournamentDraft.status === s.id ? COLORS.gold : "#25272C"}`, background: tournamentDraft.status === s.id ? "rgba(176,141,70,0.16)" : "#0F1013", color: tournamentDraft.status === s.id ? COLORS.goldSoft : COLORS.creamDim, fontSize: 12.5, fontWeight: 600 }}>{s.label}</button>
                  ))}
                </div>
              </Field>
              <Field label="Описание"><textarea value={tournamentDraft.description} onChange={(e) => setTournamentDraft({ ...tournamentDraft, description: e.target.value })} /></Field>
              <Field label="Призовые места (баллы начисляются автоматически: +100 / +50 / +30)">
                <div style={{ display: "grid", gap: 8 }}>
                  {[["first_place_id", "🥇 1 место"], ["second_place_id", "🥈 2 место"], ["third_place_id", "🥉 3 место"]].map(([key, label]) => (
                    <select key={key} value={tournamentDraft[key] || ""} onChange={(e) => setTournamentDraft({ ...tournamentDraft, [key]: e.target.value || null })} style={{ background: "#0F1013", border: "1px solid #25272C", color: COLORS.cream, borderRadius: 8, padding: "9px 12px", fontSize: 14, width: "100%" }}>
                      <option value="">{label} — не выбрано</option>
                      {[...players].sort((a, b) => a.name.localeCompare(b.name, "ru")).map((p) => <option key={p.id} value={p.id}>{label}: {p.name}</option>)}
                    </select>
                  ))}
                </div>
              </Field>
            </div>
            <button disabled={!tournamentDraft.title.trim() || !tournamentDraft.start_time || savingTournament} onClick={saveDraftTournament} style={{ marginTop: 20, width: "100%", background: (!tournamentDraft.title.trim() || !tournamentDraft.start_time) ? "#33363C" : COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 9, padding: "11px 0", fontWeight: 700, fontSize: 14.5, opacity: savingTournament ? 0.7 : 1 }}>
              {savingTournament ? "Сохранение…" : "Сохранить турнир"}
            </button>
          </div>
        </div>
      )}

      {showAuthModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(6,6,8,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 70 }} onClick={() => setShowAuthModal(false)}>
          <div onClick={(e) => e.stopPropagation()} className="fade-in" style={{ background: "#141518", border: `1px solid ${COLORS.gold}`, borderRadius: 16, width: "100%", maxWidth: 360, padding: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <span style={{ fontSize: 18 }}>🔑</span>
              <h3 style={{ fontFamily: "'Manrope', sans-serif", fontWeight: 800, fontSize: 19, margin: 0 }}>Вход для редакторов</h3>
            </div>
            <p style={{ fontSize: 12.5, color: COLORS.creamDim, lineHeight: 1.5, marginBottom: 16 }}>
              Войдите под учётной записью, которую вам выдал администратор федерации (создаётся в Supabase → Authentication → Users).
            </p>
            <div style={{ display: "grid", gap: 10 }}>
              <Field label="Email"><input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} autoFocus /></Field>
              <Field label="Пароль"><input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} /></Field>
            </div>
            {authError && <p style={{ color: "#E39A9A", fontSize: 12.5, marginTop: 10 }}>{authError}</p>}
            <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
              <button disabled={authBusy} onClick={submitAuth} style={{ flex: 1, background: COLORS.gold, color: COLORS.bgDark, border: "none", borderRadius: 8, padding: "10px 0", fontWeight: 700, fontSize: 14, opacity: authBusy ? 0.7 : 1 }}>{authBusy ? "Проверка…" : "Войти"}</button>
              <button onClick={() => setShowAuthModal(false)} style={{ background: "transparent", color: COLORS.creamDim, border: "1px solid #33363C", borderRadius: 8, padding: "10px 16px", fontSize: 14 }}>Отмена</button>
            </div>
          </div>
        </div>
      )}

      {fed && <footer style={{ borderTop: "1px solid #25272C", padding: "22px 24px", textAlign: "center", fontSize: 12.5, color: COLORS.creamDim }}>{fed.name} · {fed.address}</footer>}

      {tab === "home" && nextTournament && (
        <div onClick={() => { setSelectedTournamentId(nextTournament.id); setTab("tournament-detail"); }} style={{ position: "fixed", left: "50%", transform: "translateX(-50%)", bottom: 18, zIndex: 30, cursor: "pointer", width: "calc(100% - 32px)", maxWidth: 480, background: "#1A1C20", border: `1px solid ${COLORS.gold}`, borderRadius: 12, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14, boxShadow: "0 10px 30px rgba(0,0,0,0.45)" }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: statusMeta(nextTournament.status).color, background: "rgba(176,141,70,0.14)", borderRadius: 999, padding: "3px 9px" }}>{statusMeta(nextTournament.status).label}</span>
            </div>
            <div style={{ fontWeight: 700, fontSize: 14.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{nextTournament.title}</div>
            <div style={{ fontSize: 12, color: COLORS.creamDim, marginTop: 2 }}>{formatTournamentDate(nextTournament.start_time)}</div>
          </div>
          <span style={{ color: COLORS.goldSoft, fontSize: 20, flexShrink: 0 }}>→</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
